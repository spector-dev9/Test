name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "vite.config.js"
      - "eslint.config.js"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "android/**"
      - "scripts/**"
      - ".github/workflows/android-debug-apk.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test connection layer
        run: npm test

      - name: Build web assets
        run: npm run build

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: "platforms;android-36 build-tools;35.0.0 build-tools;36.0.0 platform-tools ndk;27.2.12479018"

      - name: Prepare embedded runtime
        run: |
          NDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          NDK_DIR="$(find "$NDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -n "$NDK_DIR"
          python3 scripts/prepare-android-runtime.py --ndk "$NDK_DIR"

      - name: Sync Capacitor
        run: node ./node_modules/@capacitor/cli/bin/capacitor sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -E 'lib/arm64-v8a/(libgit|libcurl|libpcre2-8|libgit_remote_http)\.so'

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-mobile-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
